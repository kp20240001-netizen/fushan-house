  <title>2027 01｜日本機票極簡比價 — 北海道 & 大阪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
:root {
/* Washi Editorial Surface Tokens (Hoshino / Good Design Inspired) */
--bg-washi: #F8F6F1;
--bg-surface: #FFFFFF;
--bg-subtle: #F1EDE4;
--bg-elevated: #FAF9F6;

/* High-Contrast Ink Tokens (WCAG AAA/AA compliant) */
--ink-900: #171614;
--ink-700: #45423D;
--ink-500: #6E6A63;
--ink-400: #948F86;

/* Hairline Rules */
--rule-light: #E6E1D6;
--rule-medium: #D5CFC2;
--rule-strong: #171614;

/* Refined Japanese Traditional Colors (Nippon Colors) */
--c-ci: #9E2A47; /* 茜紅 Akane - China Airlines */
--c-jx: #8C6D32; /* 琥珀金 Kohaku - STARLUX */
--c-br: #1B5E49; /* 千歳緑 Chitose - EVA Air */
--c-nh: #1A447C; /* 瑠璃紺 Ruri - ANA */
--c-jl: #A62424; /* 朱紅 Shu - JAL */
--c-it: #B87B14; /* 山吹 Yamabuki - Tigerair */

/* Motion Curves */
--spring-snap: cubic-bezier(0.22, 1, 0.36, 1);
--spring-drawer: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background-color: var(--bg-washi);
color: var(--ink-900);
font-family: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
-webkit-font-smoothing: antialiased;
min-height: 100vh;
padding: 56px 32px 96px;
/* Subtle Washi paper grain texture */
background-image: radial-gradient(rgba(23, 22, 20, 0.03) 1px, transparent 0);
background-size: 24px 24px;
}

.shell {
max-width: 960px;
margin: 0 auto;
}

/* ─── Editorial Masthead ─── */
.masthead {
display: grid;
grid-template-columns: 1fr auto;
align-items: end;
gap: 24px;
padding-bottom: 28px;
border-bottom: 1.5px solid var(--ink-900);
margin-bottom: 20px;
}

.eyebrow {
font-family: "JetBrains Mono", monospace;
font-size: 11px;
font-weight: 500;
letter-spacing: 0.16em;
text-transform: uppercase;
color: var(--ink-500);
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 10px;
}

.eyebrow-dot {
width: 6px;
height: 6px;
border-radius: 50%;
background: var(--c-jx);
display: inline-block;
}

.hero-title {
font-family: "Noto Serif TC", "Hiragino Mincho ProN", "Yu Mincho", serif;
font-size: 34px;
font-weight: 700;
letter-spacing: 0.03em;
line-height: 1.2;
color: var(--ink-900);
display: flex;
align-items: baseline;
gap: 14px;
}

.hero-code {
font-family: "Cormorant Garamond", Georgia, serif;
font-size: 38px;
font-weight: 600;
font-style: italic;
color: var(--ink-500);
letter-spacing: 0.02em;
}

/* ─── Sliding Pill Destination Switcher (oil-ui motion #2) ─── */
.seg-track {
position: relative;
display: inline-grid;
grid-template-columns: 1fr 1fr;
background: var(--bg-subtle);
padding: 4px;
border-radius: 999px;
border: 1px solid var(--rule-medium);
user-select: none;
}

.seg-thumb {
position: absolute;
top: 4px;
bottom: 4px;
left: 4px;
width: calc(50% - 4px);
background: var(--bg-surface);
border-radius: 999px;
box-shadow: 0 2px 10px rgba(23, 22, 20, 0.08), 0 0 1px rgba(23, 22, 20, 0.12);
transition: transform 280ms var(--spring-snap);
z-index: 1;
}

.seg-track[data-active="KIX"] .seg-thumb {
transform: translateX(100%);
}

.seg-btn {
position: relative;
z-index: 2;
appearance: none;
border: none;
background: transparent;
padding: 9px 22px;
font-family: inherit;
font-size: 13.5px;
font-weight: 600;
letter-spacing: 0.02em;
color: var(--ink-500);
cursor: pointer;
transition: color 200ms ease, transform 100ms ease;
min-height: 40px;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

.seg-btn:active {
transform: scale(0.97);
}

.seg-btn.active {
color: var(--ink-900);
}

.seg-btn:focus-visible {
outline: 2px solid var(--ink-900);
outline-offset: 2px;
border-radius: 999px;
}

/* ─── Filter Sub-Navigation Bar ─── */
.toolbar {
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 12px;
margin-bottom: 28px;
padding-bottom: 16px;
border-bottom: 1px solid var(--rule-light);
}

.filter-group {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

.chip-btn {
appearance: none;
background: transparent;
border: 1px solid var(--rule-medium);
color: var(--ink-700);
padding: 7px 16px;
border-radius: 999px;
font-family: inherit;
font-size: 12.5px;
font-weight: 500;
cursor: pointer;
transition: all 180ms var(--spring-snap);
min-height: 36px;
}

.chip-btn:hover {
border-color: var(--ink-900);
color: var(--ink-900);
}

.chip-btn:active {
transform: scale(0.96);
}

.chip-btn.active {
background: var(--ink-900);
color: var(--bg-washi);
border-color: var(--ink-900);
}

.lowest-summary {
font-size: 12.5px;
color: var(--ink-500);
display: flex;
align-items: center;
gap: 8px;
}

.lowest-summary strong {
font-family: "JetBrains Mono", monospace;
color: var(--ink-900);
font-weight: 600;
}

/* ─── Timetable Ledger Rows (1 Card per Airline) ─── */
.ledger {
display: flex;
flex-direction: column;
gap: 14px;
}

.ticket-card {
background: var(--bg-surface);
border: 1px solid var(--rule-light);
border-radius: 12px;
position: relative;
overflow: hidden;
transition: transform 220ms var(--spring-snap), box-shadow 220ms var(--spring-snap), border-color 220ms ease;
opacity: 0;
transform: translateY(10px);
animation: staggerIn 380ms var(--spring-snap) forwards;
}

@keyframes staggerIn {
to {
opacity: 1;
transform: translateY(0);
}
}

.ticket-card:hover {
border-color: var(--rule-medium);
box-shadow: 0 10px 30px -10px rgba(23, 22, 20, 0.07);
}

/* Left Brand Crest Bar */
.crest-bar {
position: absolute;
top: 0;
bottom: 0;
left: 0;
width: 4px;
}

.ticket-body {
display: grid;
grid-template-columns: 184px 1fr 196px;
align-items: center;
gap: 28px;
padding: 22px 28px 22px 30px;
}

/* Col 1: Carrier Identity & Date Window */
.carrier-col {
display: flex;
flex-direction: column;
gap: 6px;
}

.carrier-top {
display: flex;
align-items: center;
gap: 9px;
}

.iata-badge {
font-family: "JetBrains Mono", monospace;
font-size: 11px;
font-weight: 600;
letter-spacing: 0.05em;
color: #FFFFFF;
padding: 2px 7px;
border-radius: 4px;
line-height: 1.3;
}

.carrier-name {
font-size: 17px;
font-weight: 600;
color: var(--ink-900);
letter-spacing: 0.01em;
}

.date-window {
font-family: "JetBrains Mono", monospace;
font-size: 12.5px;
color: var(--ink-700);
letter-spacing: -0.01em;
}

.kicker-pill {
display: inline-flex;
align-items: center;
gap: 5px;
font-size: 11px;
font-weight: 500;
color: var(--ink-500);
background: var(--bg-washi);
border: 1px solid var(--rule-light);
padding: 2px 8px;
border-radius: 4px;
width: fit-content;
margin-top: 2px;
}

.kicker-pill.highlight {
color: #7A5A1E;
background: #FBF6EB;
border-color: #E6D5B0;
}

/* Col 2: Precision Horizontal Flight Axis (ANA / Good Design Timetable) */
.axis-col {
display: flex;
flex-direction: column;
gap: 14px;
padding: 0 8px;
border-left: 1px solid var(--rule-light);
border-right: 1px solid var(--rule-light);
padding-left: 24px;
padding-right: 24px;
}

.flight-leg {
display: grid;
grid-template-columns: 62px 84px 1fr 84px;
align-items: center;
gap: 12px;
}

.flt-num {
font-family: "JetBrains Mono", monospace;
font-size: 11.5px;
font-weight: 500;
color: var(--ink-500);
}

.node-time {
display: flex;
align-items: baseline;
gap: 5px;
}

.node-time.arrive {
justify-content: flex-end;
}

.clock {
font-family: "JetBrains Mono", monospace;
font-size: 18px;
font-weight: 600;
color: var(--ink-900);
font-variant-numeric: tabular-nums;
letter-spacing: -0.03em;
}

.station {
font-family: "JetBrains Mono", monospace;
font-size: 11.5px;
font-weight: 500;
color: var(--ink-500);
}

.vector-box {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}

.vector-caption {
font-size: 11px;
color: var(--ink-500);
letter-spacing: 0.03em;
white-space: nowrap;
}

.vector-svg {
width: 100%;
height: 10px;
display: block;
overflow: visible;
}

/* Col 3: Pure TWD Tax-Included Price & Primary Action */
.fare-col {
display: flex;
flex-direction: column;
align-items: flex-end;
justify-content: center;
gap: 10px;
}

.fare-Block {
text-align: right;
}

.fare-caption {
font-size: 11px;
color: var(--ink-500);
letter-spacing: 0.04em;
margin-bottom: 2px;
}

.fare-twd {
font-family: "JetBrains Mono", monospace;
font-size: 27px;
font-weight: 600;
color: var(--ink-900);
font-variant-numeric: tabular-nums;
letter-spacing: -0.03em;
line-height: 1.05;
}

.cta-btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
background: var(--ink-900);
color: var(--bg-washi);
text-decoration: none;
font-size: 12.5px;
font-weight: 500;
letter-spacing: 0.03em;
padding: 8px 18px;
border-radius: 999px;
transition: background 180ms ease, transform 100ms ease;
min-height: 36px;
}

.cta-btn:hover {
background: #33312E;
}

.cta-btn:active {
transform: scale(0.96);
}

.cta-icon {
width: 12px;
height: 12px;
stroke: currentColor;
stroke-width: 1.8;
fill: none;
}

/* ─── Smooth CSS Grid Accordion Drawer for Secondary Dates (Rule B) ─── */
.drawer-bar {
width: 100%;
appearance: none;
border: none;
border-top: 1px solid var(--rule-light);
background: var(--bg-elevated);
padding: 9px 28px 9px 30px;
display: flex;
justify-content: space-between;
align-items: center;
cursor: pointer;
font-family: inherit;
font-size: 12px;
color: var(--ink-500);
transition: background 180ms ease, color 180ms ease;
}

.drawer-bar:hover {
background: var(--bg-subtle);
color: var(--ink-900);
}

.drawer-bar-left {
display: flex;
align-items: center;
gap: 6px;
font-weight: 500;
}

.chevron-svg {
width: 13px;
height: 13px;
stroke: currentColor;
stroke-width: 1.75;
fill: none;
transition: transform 280ms var(--spring-drawer);
}

.ticket-card.expanded .chevron-svg {
transform: rotate(180deg);
}

.drawer-grid {
display: grid;
grid-template-rows: 0fr;
transition: grid-template-rows 300ms var(--spring-drawer);
background: var(--bg-subtle);
}

.ticket-card.expanded .drawer-grid {
grid-template-rows: 1fr;
}

.drawer-inner {
overflow: hidden;
}

.drawer-list {
padding: 12px 28px 14px 30px;
border-top: 1px solid var(--rule-light);
display: flex;
flex-direction: column;
gap: 8px;
}

.sub-option {
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 12px;
padding: 6px 0;
border-bottom: 1px dashed var(--rule-medium);
font-size: 12.5px;
}

.sub-option:last-child {
border-bottom: none;
}

.sub-meta {
display: flex;
align-items: center;
gap: 14px;
flex-wrap: wrap;
color: var(--ink-700);
}

.sub-date {
font-family: "JetBrains Mono", monospace;
font-weight: 600;
color: var(--ink-900);
}

.sub-right {
display: flex;
align-items: center;
gap: 14px;
}

.sub-price {
font-family: "JetBrains Mono", monospace;
font-size: 14.5px;
font-weight: 600;
color: var(--ink-900);
font-variant-numeric: tabular-nums;
}

.sub-link {
font-size: 12px;
font-weight: 500;
color: var(--ink-900);
text-decoration: underline;
text-underline-offset: 3px;
}

@media (max-width: 820px) {
body { padding: 32px 16px 64px; }
.masthead { grid-template-columns: 1fr; align-items: start; }
.ticket-body { grid-template-columns: 1fr; gap: 18px; padding: 20px; }
.axis-col { border-left: none; border-right: none; border-top: 1px solid var(--rule-light); border-bottom: 1px solid var(--rule-light); padding: 14px 0; }
.fare-col { flex-direction: row; justify-content: space-between; align-items: center; }
.fare-Block { text-align: left; }
}

@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: 0.01ms !important;
transition-duration: 0.01ms !important;
}
}
  </style>
</head>

let activeDest = "CTS";
let activeCat = "ALL";

function fmtTWD(n) {
return "NT$" + n.toLocaleString("en-US");
}

function renderVectorSVG(isStop) {
return `
<svg class="vector-svg" viewBox="0 0 180 10" preserveAspectRatio="none" aria-hidden="true">
<line x1="4" y1="5" x2="174" y2="5" stroke="#D5CFC2" stroke-width="1.25" />
<circle cx="4" cy="5" r="2.5" fill="#FFFFFF" stroke="#45423D" stroke-width="1.5" />
${isStop ? '<circle cx="90" cy="5" r="3" fill="#8C6D32" />' : ''}
<path d="M170 2 L175 5 L170 8" fill="none" stroke="#45423D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
`;
}

function selectDest(dest) {
activeDest = dest;
const track = document.getElementById("dest-switcher");
track.setAttribute("data-active", dest);
document.getElementById("tab-cts").classList.toggle("active", dest === "CTS");
document.getElementById("tab-kix").classList.toggle("active", dest === "KIX");
document.getElementById("tab-cts").setAttribute("aria-selected", dest === "CTS");
document.getElementById("tab-kix").setAttribute("aria-selected", dest === "KIX");

const data = FLIGHT_DATA[dest];
document.getElementById("dest-title").textContent = data.title;
document.getElementById("dest-code").textContent = data.code;
document.getElementById("lowest-summary").innerHTML = data.summaryHTML;

renderCards();
}

function selectCat(cat, btn) {
activeCat = cat;
document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
renderCards();
}

function toggleCardDrawer(idx) {
const card = document.getElementById("card-" + idx);
const label = document.getElementById("drawer-text-" + idx);
const count = card.getAttribute("data-alt-count");
const expanded = card.classList.toggle("expanded");
label.textContent = expanded ? "收起備選方案" : `展開其他 ${count} 個日期／轉機備選`;
}

function renderCards() {
const list = FLIGHT_DATA[activeDest].airlines.filter(a =>
activeCat === "ALL" ? true : a.cat === activeCat
);

const container = document.getElementById("ledger-container");
container.innerHTML = list.map((item, idx) => {
const hasAlts = item.alts && item.alts.length > 0;
const delayMs = idx * 45;
return `
<article class="ticket-card" id="card-${idx}" data-alt-count="${item.alts.length}" style="animation-delay: ${delayMs}ms">
<div class="crest-bar" style="background: ${item.color}"></div>
<div class="ticket-body">
<!-- Col 1: Carrier -->
<div class="carrier-col">
<div class="carrier-top">
<span class="iata-badge" style="background: ${item.color}">${item.code}</span>
<span class="carrier-name">${item.name}</span>
</div>
<div class="date-window">${item.dates}</div>
<span class="kicker-pill ${item.highlight ? 'highlight' : ''}">${item.kicker}</span>
</div>

<!-- Col 2: Horizontal Flight Axis -->
<div class="axis-col">
<div class="flight-leg">
<span class="flt-num">${item.outNo}</span>
<div class="node-time">
<span class="clock">${item.outDep}</span>
<span class="station">${item.outOrig}</span>
</div>
<div class="vector-box">
<span class="vector-caption">${item.outNote}</span>
${renderVectorSVG(item.isStop)}
</div>
<div class="node-time arrive">
<span class="clock">${item.outArr}</span>
<span class="station">${item.outDest}</span>
</div>
</div>

<div class="flight-leg">
<span class="flt-num">${item.inNo}</span>
<div class="node-time">
<span class="clock">${item.inDep}</span>
<span class="station">${item.inOrig}</span>
</div>
<div class="vector-box">
<span class="vector-caption">${item.inNote}</span>
${renderVectorSVG(item.isStop)}
</div>
<div class="node-time arrive">
<span class="clock">${item.inArr}</span>
<span class="station">${item.inDest}</span>
</div>
</div>
</div>

<!-- Col 3: Pure TWD Price & CTA -->
<div class="fare-col">
<div class="fare-Block">
<div class="fare-caption">來回含稅總價</div>
<div class="fare-twd">${fmtTWD(item.price)}</div>
</div>
<a class="cta-btn" href="${item.url}" target="_blank" rel="noopener noreferrer">
<span>Google Flights 預訂</span>
<svg class="cta-icon" viewBox="0 0 16 16" aria-hidden="true">
<path d="M4.5 11.5L11.5 4.5M11.5 4.5H5.5M11.5 4.5V10.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</a>
</div>
</div>

${hasAlts ? `
<button class="drawer-bar" type="button" onclick="toggleCardDrawer(${idx})">
<span class="drawer-bar-left">
<span id="drawer-text-${idx}">展開其他 ${item.alts.length} 個日期／轉機備選</span>
<svg class="chevron-svg" viewBox="0 0 16 16" aria-hidden="true">
<path d="M4 6L8 10L12 6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</span>
<span>同航空次要方案</span>
</button>
<div class="drawer-grid">
<div class="drawer-inner">
<div class="drawer-list">
${item.alts.map(alt => `
<div class="sub-option">
<div class="sub-meta">
<span class="sub-date">${alt.dates}</span>
<span>${alt.desc}</span>
</div>
<div class="sub-right">
<span class="sub-price">${fmtTWD(alt.price)}</span>
<a class="sub-link" href="${alt.url}" target="_blank" rel="noopener noreferrer">前往預訂 ↗</a>
</div>
</div>
`).join("")}
</div>
</div>
</div>
` : ''}
</article>
`;
}).join("");
}

renderCards();
  </script>
</body>
</html>
